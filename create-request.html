<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>طلب مساعدة</title><style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:sans-serif;background:#eef5ff;padding:2rem;}
.container{max-width:600px;margin:auto;background:white;border-radius:2rem;padding:2rem;}
.btn{background:#0f67ff;color:white;border:none;padding:12px 24px;border-radius:60px;cursor:pointer;width:100%;}
input,select,textarea{width:100%;padding:12px;margin:10px 0;border-radius:60px;border:1px solid #ccc;}
</style></head>
<body>
<div class="container">
    <h2>📝 طلب مساعدة جديد</h2>
    <form id="reqForm">
        <label>نوع المساعدة:</label>
        <select id="type"><option>تسوق</option><option>مرافقة للطبيب</option><option>مساعدة منزلية</option></select>
        <label>الوصف:</label><textarea id="desc" rows="2"></textarea>
        <label>الأولوية:</label>
        <select id="urgency"><option>عادي</option><option>مرتفع</option><option>طوارئ</option></select>
        <button type="submit" class="btn">إرسال الطلب</button>
    </form>
    <a href="senior-dashboard.html" style="display:block; text-align:center; margin-top:1rem;">⬅️ رجوع</a>
</div>
<script>
    function getUser(){return JSON.parse(sessionStorage.getItem('currentUser'));}
    document.getElementById('reqForm').addEventListener('submit',(e)=>{
        e.preventDefault();
        let user=getUser();
        if(!user){alert('يرجى تسجيل الدخول');return;}
        let newReq={
            id:Date.now(),
            title:document.getElementById('type').value,
            desc:document.getElementById('desc').value,
            urgency:document.getElementById('urgency').value,
            date:new Date().toLocaleString(),
            status:'معلق',
            seniorId:user.phone
        };
        let reqs=JSON.parse(localStorage.getItem('seniorRequests'))||[];
        reqs.push(newReq);
        localStorage.setItem('seniorRequests',JSON.stringify(reqs));
        alert('تم إنشاء الطلب بنجاح');
        window.location.href='senior-dashboard.html';
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS طوارئ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #eef5ff; padding: 2rem; text-align: center; }
        .container { max-width: 600px; margin: auto; background: white; border-radius: 2rem; padding: 2rem; }
        .sos-btn { background: #dc2626; color: white; font-size: 2rem; padding: 1rem 2rem; border-radius: 100px; border: none; cursor: pointer; margin: 2rem 0; width: 100%; }
        .sos-btn:hover { background: #b91c1c; transform: scale(1.02); }
    </style>
</head>
<body>
<div class="container">
    <h1 style="color:#dc2626">🚨 حالة طوارئ 🚨</h1>
    <p>اضغط الزر لإرسال تنبيه عاجل إلى: وكيل العائلة، المشرف، والمتطوعين القريبين.</p>
    <button id="sosBtn" class="sos-btn">🆘 إرسال SOS</button>
    <div id="sosStatus"></div>
    <a href="senior-dashboard.html" style="display:inline-block; margin-top:1rem;">⬅️ رجوع</a>
</div>
<script>
    function getUser() { return JSON.parse(sessionStorage.getItem('currentUser')); }
    document.getElementById('sosBtn').addEventListener('click', ()=>{
        let user = getUser();
        if(!user) return;
        let sosLog = JSON.parse(localStorage.getItem('sosLog')) || [];
        sosLog.push({ time: new Date().toISOString(), user: user.phone, role: user.role });
        localStorage.setItem('sosLog', JSON.stringify(sosLog));
        document.getElementById('sosStatus').innerHTML = '<div style="background:#f0f0f0; padding:1rem; border-radius:1rem; margin-top:1rem;">✅ تم إرسال SOS مع موقعك (محاكاة) إلى فريق الطوارئ</div>';
        alert('تم إبلاغ فريق الطوارئ! سيتم الاتصال بك قريباً.');
    });
</script>
</body>
</html>

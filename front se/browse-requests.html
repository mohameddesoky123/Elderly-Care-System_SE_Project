<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصفح الطلبات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Cairo', sans-serif; background: linear-gradient(145deg, #e0f0e8, #c8e0d9); padding: 2rem; }
        .container { max-width: 1200px; margin: auto; background: white; border-radius: 2rem; padding: 2rem; }
        .lang-switch { display: flex; justify-content: flex-end; gap: 0.5rem; margin-bottom: 1rem; }
        .lang-btn { background: #e2e8f0; border: none; padding: 6px 16px; border-radius: 60px; cursor: pointer; }
        .lang-btn.active { background: #1e4b8f; color: white; }
        .filter-bar { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; }
        .filter-bar select, .filter-bar input { padding: 6px 12px; border-radius: 60px; border: 1px solid #cbd5e1; }
        .request-card { background: #f8fafc; border-radius: 1rem; padding: 1rem; margin-bottom: 1rem; border-right: 5px solid #f59e0b; }
        .btn { background: #2b6ed7; color: white; border: none; padding: 6px 14px; border-radius: 60px; cursor: pointer; }
        .btn-accept { background: #27ae60; }
    </style>
</head>
<body>
<div class="container">
    <div class="lang-switch">
        <button id="langAr" class="lang-btn active">🇸🇦 عربي</button>
        <button id="langEn" class="lang-btn">🇬🇧 English</button>
    </div>
    <h2 data-ar="تصفح طلبات المساعدة المتاحة" data-en="Browse Available Help Requests">تصفح طلبات المساعدة المتاحة</h2>
    <div class="filter-bar">
        <select id="filterType">
            <option value="">كل الأنواع</option>
            <option value="تسوق">تسوق</option>
            <option value="مرافقة طبية">مرافقة طبية</option>
            <option value="تنظيف">تنظيف</option>
            <option value="تعليم تكنولوجيا">تعليم تكنولوجيا</option>
        </select>
        <input type="text" id="filterLocation" placeholder="الموقع (مدينة)">
    </div>
    <div id="requestsList"></div>
    <div style="margin-top:1rem;"><a href="volunteer-dashboard.html" data-ar="رجوع" data-en="Back">رجوع</a></div>
</div>
<script>
    let currentLang = localStorage.getItem('appLang') || 'ar';
    let user = JSON.parse(sessionStorage.getItem('currentUser'));
    if (!user || user.role !== 'volunteer') window.location.href = 'index.html';

    function translate() {
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.querySelectorAll('[data-ar][data-en]').forEach(el => {
            el.innerText = currentLang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
        });
    }
    function setLang(lang) { currentLang = lang; localStorage.setItem('appLang', lang); translate(); loadRequests(); }
    document.getElementById('langAr').onclick = () => setLang('ar');
    document.getElementById('langEn').onclick = () => setLang('en');
    translate();

    function loadRequests() {
        let all = JSON.parse(localStorage.getItem('helpRequests')) || [];
        let pending = all.filter(r => r.status === 'pending');
        let typeFilter = document.getElementById('filterType').value;
        let locationFilter = document.getElementById('filterLocation').value.trim().toLowerCase();
        let filtered = pending.filter(r => {
            if (typeFilter && r.type !== typeFilter) return false;
            if (locationFilter && !(r.location || '').toLowerCase().includes(locationFilter)) return false;
            return true;
        });
        let container = document.getElementById('requestsList');
        if (filtered.length === 0) container.innerHTML = `<div class="card">${currentLang==='ar'?'لا توجد طلبات متاحة':'No requests available'}</div>`;
        else {
            container.innerHTML = filtered.map(req => `
                <div class="request-card">
                    <div><strong>${req.type}</strong> - ${req.description || ''}</div>
                    <div>📅 ${req.date} | ${currentLang==='ar'?'الأولوية':'Priority'}: ${req.urgency || 'عادي'}</div>
                    <div>👤 ${req.seniorName}</div>
                    <div>📍 ${req.location || 'غير محدد'}</div>
                    ${req.preferredTime ? `<div>⏰ ${currentLang==='ar'?'الوقت المفضل':'Preferred time'}: ${req.preferredTime}</div>` : ''}
                    ${req.images && req.images.length ? `<div>🖼️ ${req.images.length} ${currentLang==='ar'?'صورة مرفقة':'image(s) attached'}</div>` : ''}
                    <button class="btn btn-accept" onclick="acceptRequest('${req.id}')">${currentLang==='ar'?'🤝 قبول الطلب':'🤝 Accept Request'}</button>
                </div>
            `).join('');
        }
    }
    window.acceptRequest = (id) => {
        let requests = JSON.parse(localStorage.getItem('helpRequests'));
        let idx = requests.findIndex(r => r.id == id);
        if (idx !== -1 && requests[idx].status === 'pending') {
            requests[idx].status = 'accepted';
            requests[idx].volunteerId = user.phone;
            requests[idx].volunteerName = user.name;
            localStorage.setItem('helpRequests', JSON.stringify(requests));
            alert(currentLang==='ar'?'تم قبول الطلب بنجاح':'Request accepted');
            loadRequests();
        } else alert(currentLang==='ar'?'هذا الطلب غير متاح':'Request not available');
    };
    document.getElementById('filterType').addEventListener('change', loadRequests);
    document.getElementById('filterLocation').addEventListener('input', loadRequests);
    loadRequests();
</script>
</body>
</html>

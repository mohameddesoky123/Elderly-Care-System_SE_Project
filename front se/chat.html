<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محادثة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Cairo', sans-serif; background: #eef5ff; padding: 1rem; }
        .container { max-width: 800px; margin: auto; background: white; border-radius: 2rem; overflow: hidden; display: flex; flex-direction: column; height: 90vh; }
        .chat-header { background: #1e4b8f; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .message { max-width: 70%; padding: 0.5rem 1rem; border-radius: 1rem; }
        .sent { align-self: flex-end; background: #2b6ed7; color: white; }
        .received { align-self: flex-start; background: #e2e8f0; }
        .chat-input { display: flex; padding: 1rem; gap: 0.5rem; border-top: 1px solid #cbd5e1; }
        .chat-input input { flex: 1; padding: 0.5rem; border-radius: 60px; border: 1px solid #cbd5e1; }
        .chat-input button { background: #2b6ed7; color: white; border: none; padding: 0.5rem 1rem; border-radius: 60px; cursor: pointer; }
        .location-btn { background: #27ae60; }
        .image-preview img { max-width: 150px; border-radius: 0.5rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="chat-header">
        <span id="chatPartnerName">...</span>
        <button id="sendLocationBtn" class="location-btn" style="padding:4px 12px;">📍 مشاركة الموقع</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
        <input type="text" id="messageInput" placeholder="اكتب رسالة...">
        <input type="file" id="imageInput" accept="image/*" style="display:none;">
        <button id="attachImageBtn">📷</button>
        <button id="sendMsgBtn">إرسال</button>
    </div>
</div>
<script>
    // Simplified chat for demo - uses localStorage per conversation pair
    let currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
    if (!currentUser) window.location.href = 'index.html';
    let urlParams = new URLSearchParams(window.location.search);
    let partnerId = urlParams.get('partner'); // phone of the other person
    let partnerName = urlParams.get('name') || 'المستخدم';
    document.getElementById('chatPartnerName').innerText = partnerName;
    let chatKey = [currentUser.phone, partnerId].sort().join('-');
    function loadMessages() {
        let chats = JSON.parse(localStorage.getItem('chatMessages')) || {};
        let messages = chats[chatKey] || [];
        let container = document.getElementById('chatMessages');
        container.innerHTML = '';
        messages.forEach(msg => {
            let div = document.createElement('div');
            div.className = `message ${msg.sender === currentUser.phone ? 'sent' : 'received'}`;
            if (msg.type === 'text') div.innerText = msg.content;
            else if (msg.type === 'image') div.innerHTML = `<img src="${msg.content}" style="max-width:150px; border-radius:0.5rem;">`;
            else if (msg.type === 'location') div.innerHTML = `📍 ${msg.content} <a href="${msg.mapUrl}" target="_blank">عرض على الخريطة</a>`;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }
    function sendMessage(type, content) {
        let chats = JSON.parse(localStorage.getItem('chatMessages')) || {};
        if (!chats[chatKey]) chats[chatKey] = [];
        chats[chatKey].push({ sender: currentUser.phone, type, content, timestamp: new Date().toISOString() });
        localStorage.setItem('chatMessages', JSON.stringify(chats));
        loadMessages();
    }
    document.getElementById('sendMsgBtn').onclick = () => {
        let input = document.getElementById('messageInput');
        if (input.value.trim()) {
            sendMessage('text', input.value);
            input.value = '';
        }
    };
    document.getElementById('attachImageBtn').onclick = () => document.getElementById('imageInput').click();
    document.getElementById('imageInput').onchange = (e) => {
        let file = e.target.files[0];
        if (file) {
            let reader = new FileReader();
            reader.onload = (ev) => sendMessage('image', ev.target.result);
            reader.readAsDataURL(file);
        }
    };
    document.getElementById('sendLocationBtn').onclick = () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                let lat = pos.coords.latitude;
                let lng = pos.coords.longitude;
                let mapUrl = `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=15/${lat}/${lng}`;
                sendMessage('location', `موقعي: ${lat.toFixed(4)}, ${lng.toFixed(4)}`, mapUrl);
            }, () => alert('لا يمكن الحصول على الموقع'));
        } else alert('Geolocation غير مدعوم');
    };
    loadMessages();
    setInterval(loadMessages, 3000);
</script>
</body>
</html>

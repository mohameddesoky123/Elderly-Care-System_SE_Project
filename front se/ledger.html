<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', 'Segoe UI', sans-serif; background: #eef5ff; padding: 2rem; }
        .container { max-width: 900px; margin: auto; background: white; border-radius: 2rem; padding: 2rem; }
        .lang-switch { display: flex; justify-content: flex-end; gap: 0.5rem; margin-bottom: 1rem; }
        .lang-btn { background: #e2e8f0; border: none; padding: 6px 16px; border-radius: 60px; cursor: pointer; }
        .lang-btn.active { background: #2b6ed7; color: white; }
        .tx-entry { background: #f8fafc; border-radius: 1rem; padding: 0.8rem; margin-bottom: 0.5rem; border-right: 4px solid #2b6ed7; }
        footer { margin-top: 2rem; text-align: center; }
    </style>
    <script src="lang.js"></script>
</head>
<body>
<div class="container">
    <div class="lang-switch">
        <button id="langArBtn" class="lang-btn active">🇸🇦 عربي</button>
        <button id="langEnBtn" class="lang-btn">🇬🇧 English</button>
    </div>
    <h2 data-key="ledgerTitle">📜 سجل المعاملات المالية (SilverPoints Ledger)</h2>
    <div id="ledgerList"></div>
    <footer><a href="javascript:history.back()"><span data-key="back">رجوع</span></a></footer>
</div>
<script>
    let ledger = JSON.parse(localStorage.getItem('ledger')) || [];
    if (ledger.length === 0) ledger = [{ date: new Date().toISOString(), desc: currentLang==='ar' ? 'مكافأة ترحيبية' : 'Welcome bonus', points: 100, type: 'earn' }];
    const container = document.getElementById('ledgerList');
    if (ledger.length === 0) container.innerHTML = `<div class="card">${currentLang==='ar' ? 'لا توجد معاملات' : 'No transactions'}</div>`;
    else container.innerHTML = ledger.slice().reverse().map(tx => `<div class="tx-entry">📅 ${new Date(tx.date).toLocaleString()} : ${tx.desc} <strong>${tx.points > 0 ? '+' : ''}${tx.points} ${currentLang==='ar' ? 'نقطة' : 'points'}</strong></div>`).join('');
</script>
</body>
</html>

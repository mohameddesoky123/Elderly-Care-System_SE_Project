<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Cairo', sans-serif; background: linear-gradient(145deg, #e6f0fa, #c9ddf5); padding: 2rem; }
        .container { max-width: 800px; margin: auto; background: white; border-radius: 2rem; padding: 2rem; }
        .lang-switch { display: flex; justify-content: flex-end; gap: 0.5rem; margin-bottom: 1rem; }
        .lang-btn { background: #e2e8f0; border: none; padding: 6px 16px; border-radius: 60px; cursor: pointer; }
        .lang-btn.active { background: #1e4b8f; color: white; }
        .avatar { text-align: center; margin-bottom: 1rem; }
        .avatar img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #2b6ed7; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: 600; color: #1e4b8f; }
        input, textarea { width: 100%; padding: 8px 14px; border-radius: 60px; border: 1px solid #cbd5e1; }
        .btn { background: linear-gradient(95deg, #1e4b8f, #2b6ed7); color: white; padding: 8px 16px; border: none; border-radius: 60px; cursor: pointer; margin: 0.5rem 0; }
        .btn-outline { background: white; border: 2px solid #1e4b8f; color: #1e4b8f; }
        .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    </style>
</head>
<body>
<div class="container">
    <div class="lang-switch">
        <button id="langAr" class="lang-btn active">🇸🇦 عربي</button>
        <button id="langEn" class="lang-btn">🇬🇧 English</button>
    </div>
    <h2 data-ar="الملف الشخصي" data-en="My Profile">الملف الشخصي</h2>
    <div class="avatar">
        <img id="avatarImg" src="default-avatar.png" alt="Avatar">
        <input type="file" id="avatarUpload" accept="image/*">
        <button id="uploadAvatarBtn" class="btn-outline" style="padding:4px 12px;" data-ar="رفع صورة" data-en="Upload">رفع صورة</button>
    </div>
    <div class="form-group">
        <label data-ar="الاسم الكامل" data-en="Full Name">الاسم الكامل</label>
        <input type="text" id="fullName">
    </div>
    <div class="form-group">
        <label data-ar="البريد الإلكتروني" data-en="Email">البريد الإلكتروني</label>
        <input type="email" id="email" disabled>
    </div>
    <div class="form-group">
        <label data-ar="رقم الهاتف" data-en="Phone">رقم الهاتف</label>
        <input type="tel" id="phone">
    </div>
    <div class="form-group">
        <label data-ar="العنوان (اختياري)" data-en="Address (Optional)">العنوان (اختياري)</label>
        <textarea id="address" rows="2"></textarea>
    </div>
    <div class="row">
        <button id="saveProfile" class="btn" data-ar="حفظ التغييرات" data-en="Save Changes">حفظ التغييرات</button>
        <button id="changePasswordBtn" class="btn-outline" data-ar="تغيير كلمة المرور" data-en="Change Password">تغيير كلمة المرور</button>
    </div>
    <div style="margin-top:1rem;"><a href="javascript:history.back()" data-ar="رجوع" data-en="Back">رجوع</a></div>
</div>
<script>
    let currentLang = localStorage.getItem('appLang') || 'ar';
    let user = JSON.parse(sessionStorage.getItem('currentUser'));
    if (!user) window.location.href = 'index.html';

    function translate() {
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.querySelectorAll('[data-ar][data-en]').forEach(el => {
            el.innerText = currentLang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
        });
    }
    function setLang(lang) { currentLang = lang; localStorage.setItem('appLang', lang); translate(); document.getElementById('langAr').classList.toggle('active', lang==='ar'); document.getElementById('langEn').classList.toggle('active', lang==='en'); }
    document.getElementById('langAr').onclick = () => setLang('ar');
    document.getElementById('langEn').onclick = () => setLang('en');
    translate();

    // Load user data
    let fullNameInput = document.getElementById('fullName');
    let emailInput = document.getElementById('email');
    let phoneInput = document.getElementById('phone');
    let addressInput = document.getElementById('address');
    let avatarImg = document.getElementById('avatarImg');

    function loadProfile() {
        let users = JSON.parse(localStorage.getItem('users'));
        let userData = users.find(u => u.email === user.email);
        if (userData) {
            fullNameInput.value = userData.name || '';
            emailInput.value = userData.email;
            phoneInput.value = userData.phone || '';
            let profile = JSON.parse(localStorage.getItem('userProfiles')) || {};
            if (profile[user.email]) {
                addressInput.value = profile[user.email].address || '';
                if (profile[user.email].avatar) avatarImg.src = profile[user.email].avatar;
            }
            if (userData.avatar) avatarImg.src = userData.avatar;
        }
    }
    loadProfile();

    // Save profile
    document.getElementById('saveProfile').onclick = () => {
        let users = JSON.parse(localStorage.getItem('users'));
        let idx = users.findIndex(u => u.email === user.email);
        if (idx !== -1) {
            users[idx].name = fullNameInput.value;
            users[idx].phone = phoneInput.value;
            localStorage.setItem('users', JSON.stringify(users));
            let profiles = JSON.parse(localStorage.getItem('userProfiles')) || {};
            profiles[user.email] = { address: addressInput.value, avatar: avatarImg.src };
            localStorage.setItem('userProfiles', JSON.stringify(profiles));
            // update session
            user.name = fullNameInput.value;
            user.phone = phoneInput.value;
            sessionStorage.setItem('currentUser', JSON.stringify(user));
            alert(currentLang==='ar'?'تم حفظ البيانات':'Profile saved');
        }
    };

    // Upload avatar
    document.getElementById('uploadAvatarBtn').onclick = () => {
        let file = document.getElementById('avatarUpload').files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(e) {
            avatarImg.src = e.target.result;
            // save to localStorage
            let profiles = JSON.parse(localStorage.getItem('userProfiles')) || {};
            if (!profiles[user.email]) profiles[user.email] = {};
            profiles[user.email].avatar = e.target.result;
            localStorage.setItem('userProfiles', JSON.stringify(profiles));
            alert(currentLang==='ar'?'تم رفع الصورة':'Avatar uploaded');
        };
        reader.readAsDataURL(file);
    };

    // Change password (simple popup)
    document.getElementById('changePasswordBtn').onclick = () => {
        let newPwd = prompt(currentLang==='ar'?'كلمة المرور الجديدة':'New password');
        if (newPwd && newPwd.length >= 4) {
            let users = JSON.parse(localStorage.getItem('users'));
            let idx = users.findIndex(u => u.email === user.email);
            users[idx].password = newPwd;
            localStorage.setItem('users', JSON.stringify(users));
            alert(currentLang==='ar'?'تم تغيير كلمة المرور':'Password changed');
        } else alert(currentLang==='ar'?'كلمة المرور قصيرة جداً':'Too short');
    };
</script>
</body>
</html>

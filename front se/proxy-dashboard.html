<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', 'Segoe UI', sans-serif; background: #eef5ff; padding: 2rem; }
        .container { max-width: 1200px; margin: auto; background: white; border-radius: 2rem; padding: 2rem; }
        .lang-switch { display: flex; justify-content: flex-end; gap: 0.5rem; margin-bottom: 1rem; }
        .lang-btn { background: #e2e8f0; border: none; padding: 6px 16px; border-radius: 60px; cursor: pointer; }
        .lang-btn.active { background: #2b6ed7; color: white; }
        .navbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 2rem; }
        h1 { color: #1e4b8f; }
        .points-badge { background: #0f3b6f; color: white; border-radius: 50px; padding: 0.5rem 1.2rem; }
        .grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 1rem; margin: 1.5rem 0; }
        .card { background: #f8fafc; border-radius: 1.5rem; padding: 1rem; text-align: center; cursor: pointer; border: 1px solid #cbd5e1; }
        footer { margin-top: 2rem; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 1rem; display: flex; justify-content: space-between; }
    </style>
    <script src="lang.js"></script>
</head>
<body>
<div class="container">
    <div class="lang-switch">
        <button id="langArBtn" class="lang-btn active">🇸🇦 عربي</button>
        <button id="langEnBtn" class="lang-btn">🇬🇧 English</button>
    </div>
    <div class="navbar">
        <h1><span data-key="welcomeProxy">👨‍👩‍👦 مرحباً وكيل العائلة</span> <span id="userName"></span></h1>
        <div class="points-badge"><span data-key="silverPoints">SilverPoints</span>: <strong id="pointsDisplay">0</strong></div>
    </div>
    <div class="grid-auto">
        <div class="card" onclick="location.href='create-request.html'"><span data-key="requestForRelative">📝 طلب مساعدة باسم أحد المسنين</span></div>
        <div class="card" onclick="location.href='schedule-visit.html'"><span data-key="scheduleForRelative">📅 جدولة زيارة لأحد أفراد العائلة</span></div>
        <div class="card" style="background:#fee2e2;" onclick="location.href='emergency-sos.html'"><span data-key="sosButton">🚨 طوارئ</span></div>
        <div class="card" onclick="location.href='ledger.html'"><span data-key="ledger">📜 سجل النقاط</span></div>
    </div>
    <footer><button class="btn btn-outline" onclick="logout()"><span data-key="logout">تسجيل الخروج</span></button><a href="index.html"><span data-key="home">الرئيسية</span></a></footer>
</div>
<script>
    let user = JSON.parse(sessionStorage.getItem('currentUser'));
    if (!user || user.role !== 'proxy') { alert('Unauthorized'); window.location.href = 'index.html'; }
    document.getElementById('userName').innerText = user.name;
    document.getElementById('pointsDisplay').innerText = user.silverPoints;
    function logout() { sessionStorage.clear(); window.location.href = 'index.html'; }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تقييم ومراجعة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Cairo', sans-serif; background: #eef5ff; padding: 2rem; }
        .container { max-width: 600px; margin: auto; background: white; border-radius: 2rem; padding: 2rem; }
        .stars { display: flex; gap: 0.5rem; justify-content: center; margin: 1rem 0; font-size: 2rem; cursor: pointer; }
        .star { color: #d1d5db; }
        .star.active { color: #f59e0b; }
        textarea { width: 100%; border-radius: 1rem; padding: 0.5rem; margin: 1rem 0; }
        .btn { background: #1e4b8f; color: white; padding: 10px; border-radius: 60px; border: none; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>⭐ تقييم الخدمة</h2>
    <div class="stars" id="stars">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
    </div>
    <textarea id="feedbackText" rows="4" placeholder="اكتب رأيك هنا..."></textarea>
    <button class="btn" id="submitFeedback">إرسال التقييم</button>
    <div style="margin-top:1rem;"><a href="javascript:history.back()">رجوع</a></div>
</div>
<script>
    let rating = 0;
    document.querySelectorAll('.star').forEach(star => {
        star.addEventListener('click', () => {
            rating = parseInt(star.getAttribute('data-value'));
            document.querySelectorAll('.star').forEach((s, i) => {
                if (i < rating) s.classList.add('active');
                else s.classList.remove('active');
            });
        });
    });
    document.getElementById('submitFeedback').onclick = () => {
        let feedback = {
            id: Date.now(),
            rating: rating,
            comment: document.getElementById('feedbackText').value,
            from: JSON.parse(sessionStorage.getItem('currentUser')).email,
            date: new Date().toISOString()
        };
        let allFeedback = JSON.parse(localStorage.getItem('feedbacks')) || [];
        allFeedback.push(feedback);
        localStorage.setItem('feedbacks', JSON.stringify(allFeedback));
        alert('شكراً لتقييمك');
        window.location.href = 'senior-dashboard.html';
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تقديم بلاغ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Cairo', sans-serif; background: #eef5ff; padding: 2rem; }
        .container { max-width: 600px; margin: auto; background: white; border-radius: 2rem; padding: 2rem; }
        .form-group { margin-bottom: 1rem; }
        label { font-weight: 600; display: block; }
        select, textarea, input { width: 100%; padding: 8px; border-radius: 60px; border: 1px solid #ccc; }
        .btn { background: #dc2626; color: white; padding: 10px; border: none; border-radius: 60px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>🚨 تقديم بلاغ عن سلوك غير لائق</h2>
    <div class="form-group">
        <label>نوع البلاغ</label>
        <select id="reportType">
            <option>سلوك غير لائق</option>
            <option>احتيال</option>
            <option>تأخر مستمر</option>
            <option>أخرى</option>
        </select>
    </div>
    <div class="form-group">
        <label>الشخص المبلغ ضده (البريد الإلكتروني أو الهاتف)</label>
        <input type="text" id="reportedUser">
    </div>
    <div class="form-group">
        <label>تفاصيل البلاغ</label>
        <textarea id="details" rows="4"></textarea>
    </div>
    <button class="btn" id="submitReport">إرسال البلاغ</button>
    <div style="margin-top:1rem;"><a href="javascript:history.back()">رجوع</a></div>
</div>
<script>
    document.getElementById('submitReport').onclick = () => {
        let report = {
            id: Date.now(),
            type: document.getElementById('reportType').value,
            reportedUser: document.getElementById('reportedUser').value.trim(),
            details: document.getElementById('details').value,
            reporter: JSON.parse(sessionStorage.getItem('currentUser')).email,
            date: new Date().toISOString(),
            status: 'pending'
        };
        let reports = JSON.parse(localStorage.getItem('reports')) || [];
        reports.push(report);
        localStorage.setItem('reports', JSON.stringify(reports));
        alert('تم إرسال البلاغ، سيقوم المشرف بمراجعته');
        window.location.href = 'volunteer-dashboard.html';
    };
</script>
</body>
</html>

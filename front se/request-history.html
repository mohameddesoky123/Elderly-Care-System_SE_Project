<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الطلبات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Cairo', sans-serif; background: linear-gradient(145deg, #e6f0fa, #c9ddf5); padding: 2rem; }
        .container { max-width: 1200px; margin: auto; background: white; border-radius: 2rem; padding: 2rem; }
        .lang-switch { display: flex; justify-content: flex-end; margin-bottom: 1rem; }
        .lang-btn { background: #e2e8f0; border: none; padding: 6px 16px; border-radius: 60px; cursor: pointer; }
        .lang-btn.active { background: #1e4b8f; color: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        .btn-small { background: #2b6ed7; color: white; border: none; padding: 4px 12px; border-radius: 60px; cursor: pointer; margin: 0 2px; }
        .btn-cancel { background: #dc2626; }
    </style>
</head>
<body>
<div class="container">
    <div class="lang-switch">
        <button id="langAr" class="lang-btn active">🇸🇦 عربي</button>
        <button id="langEn" class="lang-btn">🇬🇧 English</button>
    </div>
    <h2 data-ar="سجل طلبات المساعدة" data-en="Help Requests History">سجل طلبات المساعدة</h2>
    <table id="requestsTable">
        <thead><tr><th data-ar="النوع" data-en="Type">النوع</th><th data-ar="التاريخ" data-en="Date">التاريخ</th><th data-ar="الحالة" data-en="Status">الحالة</th><th data-ar="إجراءات" data-en="Actions">إجراءات</th></tr></thead>
        <tbody></tbody>
    </table>
    <div style="margin-top:1rem;"><a href="senior-dashboard.html" data-ar="رجوع" data-en="Back">رجوع</a></div>
</div>
<script>
    let currentLang = localStorage.getItem('appLang') || 'ar';
    let user = JSON.parse(sessionStorage.getItem('currentUser'));
    if (!user) window.location.href = 'index.html';

    function translate() {
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.querySelectorAll('[data-ar][data-en]').forEach(el => {
            el.innerText = currentLang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
        });
    }
    function setLang(lang) { currentLang = lang; localStorage.setItem('appLang', lang); translate(); document.getElementById('langAr').classList.toggle('active', lang==='ar'); document.getElementById('langEn').classList.toggle('active', lang==='en'); loadRequests(); }
    document.getElementById('langAr').onclick = () => setLang('ar');
    document.getElementById('langEn').onclick = () => setLang('en');
    translate();

    function loadRequests() {
        let all = JSON.parse(localStorage.getItem('helpRequests')) || [];
        let my = all.filter(r => r.seniorId === user.phone);
        let tbody = document.querySelector('#requestsTable tbody');
        tbody.innerHTML = '';
        my.forEach(req => {
            let row = tbody.insertRow();
            row.insertCell(0).innerText = req.type;
            row.insertCell(1).innerText = req.date;
            let statusCell = row.insertCell(2);
            statusCell.innerText = req.status === 'pending' ? (currentLang==='ar'?'قيد الانتظار':'Pending') : (req.status === 'accepted' ? (currentLang==='ar'?'مقبول':'Accepted') : (currentLang==='ar'?'مكتمل':'Completed'));
            let actionsCell = row.insertCell(3);
            if (req.status === 'pending') {
                let editBtn = document.createElement('button');
                editBtn.innerText = currentLang==='ar'?'تعديل':'Edit';
                editBtn.className = 'btn-small';
                editBtn.onclick = () => editRequest(req.id);
                let cancelBtn = document.createElement('button');
                cancelBtn.innerText = currentLang==='ar'?'إلغاء':'Cancel';
                cancelBtn.className = 'btn-small btn-cancel';
                cancelBtn.onclick = () => cancelRequest(req.id);
                actionsCell.appendChild(editBtn);
                actionsCell.appendChild(cancelBtn);
            } else {
                actionsCell.innerText = '—';
            }
        });
    }
    function editRequest(id) {
        let newDesc = prompt(currentLang==='ar'?'تعديل الوصف':'Edit description');
        if (newDesc !== null) {
            let requests = JSON.parse(localStorage.getItem('helpRequests'));
            let idx = requests.findIndex(r => r.id == id);
            if (idx !== -1) {
                requests[idx].description = newDesc;
                localStorage.setItem('helpRequests', JSON.stringify(requests));
                loadRequests();
            }
        }
    }
    function cancelRequest(id) {
        if (confirm(currentLang==='ar'?'هل أنت متأكد من إلغاء الطلب؟':'Are you sure to cancel?')) {
            let requests = JSON.parse(localStorage.getItem('helpRequests'));
            let updated = requests.filter(r => r.id != id);
            localStorage.setItem('helpRequests', JSON.stringify(updated));
            loadRequests();
        }
    }
    loadRequests();
</script>
</body>
</html>

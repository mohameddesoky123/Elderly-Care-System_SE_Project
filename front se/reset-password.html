<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Cairo', sans-serif; background: linear-gradient(145deg, #e6f0fa, #c9ddf5); min-height: 100vh; padding: 2rem; }
        .container { max-width: 500px; margin: auto; background: white; border-radius: 2rem; padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .lang-switch { display: flex; justify-content: flex-end; gap: 0.5rem; margin-bottom: 1rem; }
        .lang-btn { background: #e2e8f0; border: none; padding: 6px 16px; border-radius: 60px; cursor: pointer; }
        .lang-btn.active { background: #1e4b8f; color: white; }
        h2 { text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.3rem; color: #1e4b8f; }
        input { width: 100%; padding: 10px 14px; border-radius: 60px; border: 1px solid #cbd5e1; }
        .btn { background: linear-gradient(95deg, #1e4b8f, #2b6ed7); color: white; padding: 10px; border: none; border-radius: 60px; width: 100%; cursor: pointer; margin-top: 0.5rem; }
        .error { color: #dc2626; margin-top: 0.5rem; text-align: center; }
        .success { color: #10b981; margin-top: 0.5rem; text-align: center; }
        .back-link { text-align: center; margin-top: 1rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="lang-switch">
        <button id="langAr" class="lang-btn active">🇸🇦 عربي</button>
        <button id="langEn" class="lang-btn">🇬🇧 English</button>
    </div>
    <h2 data-ar="استعادة كلمة المرور" data-en="Reset Password">استعادة كلمة المرور</h2>
    <div id="step1">
        <div class="form-group">
            <label data-ar="البريد الإلكتروني" data-en="Email">البريد الإلكتروني</label>
            <input type="email" id="resetEmail" placeholder="example@domain.com">
        </div>
        <button id="sendResetOtp" class="btn" data-ar="إرسال رمز التحقق" data-en="Send OTP">إرسال رمز التحقق</button>
        <div id="resetOtpMsg"></div>
    </div>
    <div id="step2" style="display:none;">
        <div class="form-group">
            <label data-ar="رمز التحقق (OTP)" data-en="Verification Code">رمز التحقق (OTP)</label>
            <input type="text" id="resetOtp" placeholder="123456">
        </div>
        <button id="verifyResetOtp" class="btn" data-ar="تحقق" en="Verify">تحقق</button>
    </div>
    <div id="step3" style="display:none;">
        <div class="form-group">
            <label data-ar="كلمة المرور الجديدة" data-en="New Password">كلمة المرور الجديدة</label>
            <input type="password" id="newPassword">
        </div>
        <div class="form-group">
            <label data-ar="تأكيد كلمة المرور" data-en="Confirm Password">تأكيد كلمة المرور</label>
            <input type="password" id="confirmPassword">
        </div>
        <button id="updatePasswordBtn" class="btn" data-ar="تحديث كلمة المرور" data-en="Update Password">تحديث كلمة المرور</button>
    </div>
    <div class="back-link"><a href="index.html" data-ar="← العودة لتسجيل الدخول" data-en="← Back to Login">← العودة لتسجيل الدخول</a></div>
</div>
<script>
    let currentLang = localStorage.getItem('appLang') || 'ar';
    let resetEmail = null;
    let resetOtpVerified = false;
    function translate() {
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.querySelectorAll('[data-ar][data-en]').forEach(el => {
            el.innerText = currentLang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
        });
    }
    function setLang(lang) { currentLang = lang; localStorage.setItem('appLang', lang); translate(); document.getElementById('langAr').classList.toggle('active', lang==='ar'); document.getElementById('langEn').classList.toggle('active', lang==='en'); }
    document.getElementById('langAr').onclick = () => setLang('ar');
    document.getElementById('langEn').onclick = () => setLang('en');
    translate();
    // Step 1: Send OTP
    document.getElementById('sendResetOtp').onclick = () => {
        let email = document.getElementById('resetEmail').value.trim();
        let users = JSON.parse(localStorage.getItem('users')) || [];
        if (!users.find(u => u.email === email)) {
            document.getElementById('resetOtpMsg').innerHTML = `<span class="error">${currentLang==='ar'?'البريد غير مسجل':'Email not registered'}</span>`;
            return;
        }
        resetEmail = email;
        let fakeOtp = '123456';
        sessionStorage.setItem('resetOtp', fakeOtp);
        document.getElementById('resetOtpMsg').innerHTML = `<span class="success">${currentLang==='ar'?`تم إرسال رمز إلى ${email} (استخدم 123456)`:`OTP sent to ${email} (use 123456)`}</span>`;
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
    };
    // Step 2: Verify OTP
    document.getElementById('verifyResetOtp').onclick = () => {
        let code = document.getElementById('resetOtp').value.trim();
        if (code === '123456') {
            resetOtpVerified = true;
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'block';
        } else {
            alert(currentLang==='ar'?'رمز خاطئ':'Wrong code');
        }
    };
    // Step 3: Update password
    document.getElementById('updatePasswordBtn').onclick = () => {
        if (!resetOtpVerified) return;
        let newPwd = document.getElementById('newPassword').value;
        let confirm = document.getElementById('confirmPassword').value;
        if (newPwd !== confirm) { alert(currentLang==='ar'?'كلمتا المرور غير متطابقتين':'Passwords do not match'); return; }
        if (newPwd.length < 4) { alert(currentLang==='ar'?'كلمة المرور قصيرة جداً':'Password too short'); return; }
        let users = JSON.parse(localStorage.getItem('users'));
        let idx = users.findIndex(u => u.email === resetEmail);
        if (idx !== -1) {
            users[idx].password = newPwd;
            localStorage.setItem('users', JSON.stringify(users));
            alert(currentLang==='ar'?'تم تحديث كلمة المرور بنجاح':'Password updated');
            window.location.href = 'index.html';
        } else alert('Error');
    };
</script>
</body>
</html>

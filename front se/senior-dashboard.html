<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المسن | شبكة الرعاية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Cairo', sans-serif;
            background: linear-gradient(145deg, #eef5ff 0%, #e0eaf5 100%);
            padding: 1.5rem;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
        .lang-switch { display: flex; justify-content: flex-end; gap: 0.5rem; margin-bottom: 1rem; }
        .lang-btn { background: #e2e8f0; border: none; padding: 6px 16px; border-radius: 60px; cursor: pointer; font-weight: bold; }
        .lang-btn.active { background: #1e4b8f; color: white; }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            background: #ffffffcc;
            padding: 1rem 2rem;
            border-radius: 3rem;
            margin-bottom: 1.5rem;
        }
        h1 { font-size: 1.8rem; background: linear-gradient(135deg, #1e4b8f, #2b6ed7); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .points-badge { background: #0f3b6f; color: white; border-radius: 60px; padding: 0.5rem 1.2rem; font-weight: bold; }
        .greeting-card {
            background: linear-gradient(120deg, #fef9e6, #fff4e0);
            border-radius: 2rem;
            padding: 1rem 2rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: white;
            border-radius: 1.5rem;
            padding: 1.2rem;
            text-align: center;
            box-shadow: 0 5px 12px rgba(0,0,0,0.05);
            transition: 0.2s;
        }
        .stat-card:hover { transform: translateY(-4px); }
        .stat-number { font-size: 2rem; font-weight: 800; color: #2b6ed7; }
        .grid-auto {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .card {
            background: white;
            border-radius: 1.5rem;
            padding: 1.2rem;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #e2e8f0;
        }
        .card:hover { transform: scale(1.02); background: #f0f9ff; }
        .request-item {
            background: white;
            border-radius: 1.25rem;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            border-right: 5px solid;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .footer-actions {
            background: #eef2fa;
            border-radius: 2rem;
            padding: 1rem;
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .btn-outline { background: white; border: 2px solid #1e4b8f; color: #1e4b8f; padding: 6px 20px; border-radius: 60px; cursor: pointer; }
        .tip-icon { font-size: 1.2rem; background: #e2e8f0; padding: 0.2rem 0.6rem; border-radius: 50px; }
    </style>
</head>
<body>
<div class="container">
    <div class="lang-switch">
        <button id="langArBtn" class="lang-btn active">🇸🇦 عربي</button>
        <button id="langEnBtn" class="lang-btn">🇬🇧 English</button>
    </div>
    <div class="navbar">
        <h1><span data-ar="🧓 لوحة المسن" data-en="🧓 Senior Dashboard">🧓 لوحة المسن</span></h1>
        <div class="points-badge">⭐ <span id="pointsDisplay">0</span> <span data-ar="نقطة" data-en="Points">نقطة</span></div>
    </div>

    <!-- بطاقة الترحيب والنصيحة -->
    <div class="greeting-card">
        <div>
            <h2 id="greetingMsg">مرحباً، <span id="userName"></span> 🌟</h2>
            <p id="dailyTip" class="tip-icon">💡 نصيحة اليوم: يمكنك طلب المساعدة في أي وقت</p>
        </div>
        <span style="font-size: 3rem;">🧓🤝</span>
    </div>

    <!-- كروت الإحصائيات -->
    <div class="stats-row">
        <div class="stat-card"><span data-ar="📋 إجمالي الطلبات" data-en="📋 Total Requests">📋 إجمالي الطلبات</span><br><span class="stat-number" id="totalRequests">0</span></div>
        <div class="stat-card"><span data-ar="⏳ قيد الانتظار" data-en="⏳ Pending">⏳ قيد الانتظار</span><br><span class="stat-number" id="pendingRequests">0</span></div>
        <div class="stat-card"><span data-ar="✅ مكتملة" data-en="✅ Completed">✅ مكتملة</span><br><span class="stat-number" id="completedRequests">0</span></div>
        <div class="stat-card"><span data-ar="🚨 تنبيهات الطوارئ" data-en="🚨 SOS Alerts">🚨 تنبيهات الطوارئ</span><br><span class="stat-number" id="sosCount">0</span></div>
    </div>

    <!-- أزرار الخدمات السريعة -->
    <div class="grid-auto">
        <div class="card" onclick="location.href='create-request.html'"><div style="font-size:2.5rem;">📝</div><div data-ar="طلب مساعدة جديد" data-en="New Help Request">طلب مساعدة جديد</div></div>
        <div class="card" onclick="location.href='schedule-visit.html'"><div style="font-size:2.5rem;">📅</div><div data-ar="جدولة زيارة" data-en="Schedule Visit">جدولة زيارة</div></div>
        <div class="card" style="background:#fee2e2;" onclick="location.href='emergency-sos.html'"><div style="font-size:2.5rem;">🚨</div><div data-ar="SOS طوارئ" data-en="SOS Emergency">SOS طوارئ</div></div>
        <div class="card" onclick="location.href='ledger.html'"><div style="font-size:2.5rem;">📜</div><div data-ar="سجل النقاط" data-en="Points Ledger">سجل النقاط</div></div>
    </div>

    <h2 data-ar="📌 طلبات المساعدة الخاصة بي" data-en="📌 My Help Requests">📌 طلبات المساعدة الخاصة بي</h2>
    <div id="requestsList" style="margin-top: 1rem;"></div>

    <!-- شريط سفلي بالروابط والإشعارات -->
    <div class="footer-actions">
        <span>💡 <span data-ar="نقاط SilverPoints تساعدك في الحصول على خدمات مميزة" data-en="SilverPoints help you get premium services">نقاط SilverPoints تساعدك في الحصول على خدمات مميزة</span></span>
        <button class="btn-outline" onclick="logout()"><span data-ar="تسجيل الخروج" data-en="Logout">تسجيل الخروج</span></button>
        <a href="index.html" style="color:#1e4b8f;"><span data-ar="الرئيسية" data-en="Home">الرئيسية</span></a>
    </div>
</div>

<script>
    let currentLang = localStorage.getItem('appLang') || 'ar';
    let user = JSON.parse(sessionStorage.getItem('currentUser'));
    if (!user || (user.role !== 'senior' && user.role !== 'proxy')) {
        alert(currentLang === 'ar' ? 'الرجاء تسجيل الدخول' : 'Please login');
        window.location.href = 'index.html';
    }
    document.getElementById('userName').innerText = user.name.split(' ')[0];
    document.getElementById('pointsDisplay').innerText = user.silverPoints;

    // نصائح يومية متعددة
    const tips = {
        ar: [
            "💡 يمكنك استخدام نقاطك لجدولة زيارات منزلية.",
            "📞 زر SOS متوفر دائمًا للحالات الطارئة.",
            "⭐ قيم المتطوعين بعد الخدمة لتحسين الجودة.",
            "👨‍👩‍👦 وكيل العائلة يمكنه مساعدتك في إدارة الطلبات.",
            "🕊️ نحن هنا دائمًا لخدمتك، لا تتردد في طلب المساعدة."
        ],
        en: [
            "💡 Use your points to schedule home visits.",
            "📞 SOS button is always available for emergencies.",
            "⭐ Rate volunteers after service to improve quality.",
            "👨‍👩‍👦 Family proxy can help manage your requests.",
            "🕊️ We are always here for you, don't hesitate to ask for help."
        ]
    };
    function setDailyTip() {
        let arr = tips[currentLang] || tips.ar;
        let randomTip = arr[Math.floor(Math.random() * arr.length)];
        document.getElementById('dailyTip').innerHTML = randomTip;
    }
    function setGreeting() {
        let hour = new Date().getHours();
        let greetAr = hour < 12 ? 'صباح الخير' : 'مساء الخير';
        let greetEn = hour < 12 ? 'Good morning' : 'Good evening';
        let greet = currentLang === 'ar' ? greetAr : greetEn;
        document.getElementById('greetingMsg').innerHTML = `${greet}, ${user.name.split(' ')[0]} 🌟`;
    }

    function loadRequests() {
        let all = JSON.parse(localStorage.getItem('helpRequests')) || [];
        let my = all.filter(r => r.seniorId === user.phone);
        const container = document.getElementById('requestsList');
        if (my.length === 0) container.innerHTML = `<div class="card">${currentLang === 'ar' ? '✨ لا توجد طلبات حالياً، ابدأ بطلب جديد' : '✨ No requests yet, start a new request'}</div>`;
        else {
            container.innerHTML = my.map(req => {
                let statusClass = req.status === 'pending' ? '#f59e0b' : (req.status === 'accepted' ? '#3b82f6' : '#10b981');
                let statusText = '';
                if (req.status === 'pending') statusText = currentLang === 'ar' ? '⏳ قيد الانتظار' : '⏳ Pending';
                else if (req.status === 'accepted') statusText = currentLang === 'ar' ? `✅ تم القبول بواسطة ${req.volunteerName || ''}` : `✅ Accepted by ${req.volunteerName || ''}`;
                else statusText = currentLang === 'ar' ? '✔ مكتملة' : '✔ Completed';
                return `<div class="request-item" style="border-right-color: ${statusClass};">
                            <div><strong>${req.title}</strong><br><small>📅 ${req.date} | ${currentLang === 'ar' ? 'الأولوية' : 'Priority'}: ${req.urgency}</small></div>
                            <div><span>${statusText}</span></div>
                        </div>`;
            }).join('');
        }
        document.getElementById('totalRequests').innerText = my.length;
        document.getElementById('pendingRequests').innerText = my.filter(r => r.status === 'pending').length;
        document.getElementById('completedRequests').innerText = my.filter(r => r.status === 'completed').length;
        let sosLog = JSON.parse(localStorage.getItem('sosLog')) || [];
        document.getElementById('sosCount').innerText = sosLog.filter(s => s.userId === user.phone).length;
    }

    function logout() { sessionStorage.clear(); window.location.href = 'index.html'; }

    function translatePage(lang) {
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        document.querySelectorAll('[data-ar][data-en]').forEach(el => {
            el.innerText = lang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
        });
        setDailyTip();
        setGreeting();
        loadRequests();
    }
    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('appLang', lang);
        translatePage(lang);
        document.getElementById('langArBtn').classList.toggle('active', lang === 'ar');
        document.getElementById('langEnBtn').classList.toggle('active', lang === 'en');
    }
    document.getElementById('langArBtn').onclick = () => setLanguage('ar');
    document.getElementById('langEnBtn').onclick = () => setLanguage('en');

    setLanguage(currentLang);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', 'Segoe UI', sans-serif; background: #eef5ff; padding: 2rem; }
        .container { max-width: 700px; margin: auto; background: white; border-radius: 2rem; padding: 2rem; }
        .lang-switch { display: flex; justify-content: flex-end; gap: 0.5rem; margin-bottom: 1rem; }
        .lang-btn { background: #e2e8f0; border: none; padding: 6px 16px; border-radius: 60px; cursor: pointer; }
        .lang-btn.active { background: #2b6ed7; color: white; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 30px; border: 1px solid #ccc; }
        .btn { background: #2b6ed7; color: white; border: none; cursor: pointer; }
    </style>
    <script src="lang.js"></script>
</head>
<body>
<div class="container">
    <div class="lang-switch">
        <button id="langArBtn" class="lang-btn active">🇸🇦 عربي</button>
        <button id="langEnBtn" class="lang-btn">🇬🇧 English</button>
    </div>
    <h2 data-key="verificationTitle">📎 التحقق كمتطوع</h2>
    <p data-key="uploadDocs">يرجى رفع المستندات التالية ليتم مراجعتها من قبل المشرف:</p>
    <ul><li data-key="idImage">صورة البطاقة الشخصية</li><li data-key="certificate">شهادة حسن سير وسلوك (اختياري)</li></ul>
    <form id="verifyForm"><input type="file" accept="image/*" required><input type="file" accept="image/*"><button type="submit" class="btn" data-key="sendVerification">إرسال طلب التحقق</button></form>
    <footer><a href="volunteer-dashboard.html"><span data-key="back">رجوع</span></a></footer>
</div>
<script>
    let user = JSON.parse(sessionStorage.getItem('currentUser'));
    if (!user || user.role !== 'volunteer') { alert('Unauthorized'); window.location.href = 'index.html'; }
    document.getElementById('verifyForm').onsubmit = (e) => {
        e.preventDefault();
        let pending = JSON.parse(localStorage.getItem('verificationRequests')) || [];
        pending.push({ name: user.name, phone: user.phone, docType: 'هوية', date: new Date().toISOString() });
        localStorage.setItem('verificationRequests', JSON.stringify(pending));
        alert(currentLang==='ar' ? 'تم إرسال طلب التحقق بنجاح' : 'Verification request sent');
        window.location.href = 'volunteer-dashboard.html';
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وكيل العائلة | شبكة رعاية المسنين</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Cairo', sans-serif; background: #eef5ff; padding: 1.5rem; }
        .container { max-width: 1200px; margin: auto; background: white; border-radius: 2rem; padding: 2rem; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1); }
        h1 { color: #1e4b8f; }
        .grid { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1.5rem 0; }
        .card { background: #f8fafc; border-radius: 1.5rem; padding: 1.2rem; flex: 1; min-width: 180px; text-align: center; cursor: pointer; border: 1px solid #cbd5e1; transition: 0.2s; }
        .card:hover { background: #e6f0ff; transform: translateY(-3px); }
        .btn { background: #0f67ff; color: white; border: none; padding: 10px 20px; border-radius: 60px; cursor: pointer; margin-top: 1rem; display: inline-block; text-decoration: none; }
        .btn-outline { background: white; color: #0f67ff; border: 2px solid #0f67ff; }
        footer { margin-top: 2rem; text-align: center; border-top: 1px solid #cbd5e1; padding-top: 1rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>👨‍👩‍👦 مرحباً وكيل العائلة <span id="userName"></span></h1>
    <div class="sub">يمكنك إدارة طلبات المسنين في عائلتك</div>
    <div class="grid">
        <div class="card" onclick="location.href='create-request.html'">📝 طلب مساعدة باسم أحد الأقارب</div>
        <div class="card" onclick="location.href='schedule-visit.html'">📅 جدولة زيارة لوالد/والدة</div>
        <div class="card" onclick="location.href='emergency-sos.html'">🚨 تنبيه طوارئ</div>
        <div class="card" onclick="location.href='ledger.html'">📜 سجل النقاط</div>
    </div>
    <footer><button class="btn btn-outline" onclick="logout()">تسجيل الخروج</button> <a href="index.html">🏠 الرئيسية</a></footer>
</div>
<script>
    function getUser() { return JSON.parse(sessionStorage.getItem('currentUser')); }
    let user = getUser();
    if(!user || user.role !== 'proxy') { alert('يجب تسجيل الدخول كوكيل'); window.location.href = 'index.html'; }
    document.getElementById('userName').innerText = user.name;
    function logout() { sessionStorage.clear(); window.location.href = 'index.html'; }
</script>
</body>
</html>

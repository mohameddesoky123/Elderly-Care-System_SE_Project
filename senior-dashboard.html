<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المسن</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Cairo', sans-serif; background: #eef5ff; padding: 1.5rem; }
        .container { max-width: 1200px; margin: auto; background: white; border-radius: 2rem; padding: 2rem; }
        h1 { font-size: 2rem; color: #1e4b8f; }
        .sub { color: #2c5282; margin-bottom: 1rem; }
        .stats-grid { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1.5rem 0; }
        .stat-card { background: #f0f9ff; border-radius: 1.5rem; padding: 1rem; flex: 1; min-width: 120px; text-align: center; }
        .stat-number { font-size: 2rem; font-weight: bold; color: #0f67ff; }
        .action-buttons { display: flex; flex-wrap: wrap; gap: 1rem; margin: 2rem 0; justify-content: center; }
        .btn { background: #0f67ff; color: white; border: none; padding: 10px 20px; border-radius: 60px; cursor: pointer; font-size: 1rem; text-decoration: none; display: inline-block; }
        .btn-danger { background: #dc2626; }
        .btn-outline { background: white; color: #0f67ff; border: 2px solid #0f67ff; }
        .request-item { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; background: #f8fafc; border-radius: 1.5rem; padding: 1rem; margin-bottom: 0.8rem; border-right: 5px solid #0f67ff; }
        .status-pending { background: #fef3c7; color: #b45309; padding: 4px 12px; border-radius: 40px; font-size: 0.8rem; }
        .empty-state { text-align: center; padding: 2rem; background: #f8fafc; border-radius: 2rem; }
        footer { margin-top: 2rem; display: flex; justify-content: space-between; flex-wrap: wrap; }
        @media (max-width: 640px) { body { padding: 0.8rem; } .container { padding: 1rem; } }
    </style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; flex-wrap: wrap;">
        <h1>🧓 مرحباً، <span id="userName"></span></h1>
        <div class="stat-card" style="background:#0f67ff; color:white;">⭐ SilverPoints: <strong id="pointsDisplay">0</strong></div>
    </div>
    <p class="sub">لوحة التحكم - طلبات المساعدة والزيارات</p>

    <div class="stats-grid">
        <div class="stat-card">📋 إجمالي الطلبات<br><span class="stat-number" id="totalRequests">0</span></div>
        <div class="stat-card">⏳ معلقة<br><span class="stat-number" id="pendingRequests">0</span></div>
        <div class="stat-card">✅ مكتملة<br><span class="stat-number" id="completedRequests">0</span></div>
        <div class="stat-card">🚨 طوارئ<br><span class="stat-number" id="sosCount">0</span></div>
    </div>

    <div class="action-buttons">
        <button class="btn" onclick="location.href='create-request.html'">📝 طلب مساعدة</button>
        <button class="btn" onclick="location.href='schedule-visit.html'">📅 جدولة زيارة</button>
        <button class="btn btn-danger" onclick="location.href='emergency-sos.html'">🚨 SOS</button>
        <button class="btn" onclick="location.href='ledger.html'">📜 سجل المعاملات</button>
    </div>

    <h2>📌 طلباتي</h2>
    <div id="requestsList"><div class="empty-state">جاري التحميل...</div></div>

    <footer>
        <button class="btn-outline btn" onclick="logout()">تسجيل الخروج</button>
        <a href="index.html" style="color:#0f67ff;">🏠 الرئيسية</a>
    </footer>
</div>

<script>
    function getUser() { return JSON.parse(sessionStorage.getItem('currentUser')); }
    function showToast(msg, isErr=false) {
        let d = document.createElement('div');
        d.innerText = msg;
        d.style.cssText = `position:fixed; bottom:20px; left:20px; right:20px; max-width:400px; margin:auto; background:${isErr?'#dc2626':'#0f67ff'}; color:white; padding:12px; border-radius:60px; text-align:center; z-index:9999;`;
        document.body.appendChild(d);
        setTimeout(()=>d.remove(),3000);
    }
    function updatePoints() {
        let u = getUser();
        if(u) document.getElementById('pointsDisplay').innerText = u.silverPoints;
    }
    let user = getUser();
    if(!user || (user.role!=='senior' && user.role!=='proxy')) { alert('يرجى تسجيل الدخول'); window.location.href='index.html'; }
    document.getElementById('userName').innerText = user.name;
    updatePoints();

    function loadRequests() {
        let requests = JSON.parse(localStorage.getItem('seniorRequests')) || [];
        let my = requests.filter(r => r.seniorId === user.phone);
        let container = document.getElementById('requestsList');
        if(my.length===0) container.innerHTML = '<div class="empty-state">📭 لا توجد طلبات</div>';
        else {
            container.innerHTML = my.map(req => `
                <div class="request-item">
                    <div><strong>${req.title}</strong><br><small>${req.date} | ${req.urgency}</small></div>
                    <div><span class="status-pending">${req.status}</span>
                    ${req.status==='معلق'?` <button class="btn" style="background:#dc2626; padding:4px 12px;" onclick="cancelReq('${req.id}')">إلغاء</button>`:''}</div>
                </div>
            `).join('');
        }
        document.getElementById('totalRequests').innerText = my.length;
        document.getElementById('pendingRequests').innerText = my.filter(r=>r.status==='معلق').length;
        document.getElementById('completedRequests').innerText = my.filter(r=>r.status==='مكتمل').length;
        let sos = JSON.parse(localStorage.getItem('sosLog')) || [];
        document.getElementById('sosCount').innerText = sos.filter(s=>s.user===user.phone).length;
    }
    window.cancelReq = (id) => {
        let reqs = JSON.parse(localStorage.getItem('seniorRequests')) || [];
        reqs = reqs.filter(r=>r.id != id);
        localStorage.setItem('seniorRequests', JSON.stringify(reqs));
        loadRequests();
        showToast('تم الإلغاء');
    };
    window.logout = () => { sessionStorage.clear(); window.location.href='index.html'; };
    loadRequests();
</script>
</body>
</html>

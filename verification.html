<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من الهوية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #eef5ff; padding: 2rem; }
        .container { max-width: 600px; margin: auto; background: white; border-radius: 2rem; padding: 2rem; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 40px; border: 1px solid #ccc; }
        .btn { background: #0f67ff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>📎 التحقق للمتطوعين</h2>
    <p>يرجى رفع المستندات المطلوبة (هوية، شهادة حسن سير)</p>
    <form id="verifyForm">
        <label>صورة البطاقة الشخصية:</label><input type="file" accept="image/*">
        <label>شهادة حسن سير (اختياري):</label><input type="file">
        <button type="submit" class="btn">إرسال طلب التحقق</button>
    </form>
    <a href="volunteer-dashboard.html">رجوع</a>
</div>
<script>
    function getUser() { return JSON.parse(sessionStorage.getItem('currentUser')); }
    function showToast(msg) { let t=document.createElement('div'); t.innerText=msg; t.style.position='fixed'; t.style.bottom='20px'; t.style.backgroundColor='#0f67ff'; t.style.color='white'; t.style.padding='12px'; t.style.borderRadius='60px'; t.style.left='20px'; t.style.right='20px'; t.style.textAlign='center'; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); }
    document.getElementById('verifyForm').addEventListener('submit', (e)=>{
        e.preventDefault();
        let user = getUser();
        if(!user) return;
        let req = { name: user.name, phone: user.phone, docType: 'هوية', status: 'pending' };
        let pending = JSON.parse(localStorage.getItem('verificationRequests')) || [];
        pending.push(req);
        localStorage.setItem('verificationRequests', JSON.stringify(pending));
        showToast('تم إرسال طلب التحقق للمشرف');
        setTimeout(()=>window.location.href='volunteer-dashboard.html',1500);
    });
</script>
</body>
</html>
